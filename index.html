<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Your apps, in one place.">
    <meta name="apps-source" content="./api/catalog">
    <link rel="icon" type="image/svg+xml" href="/src/brand.svg">
    <title>Bifrost</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to apps</a>
    <div class="site">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Bifrost home">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 25V15a11 11 0 0 1 22 0v10M11 25V15a5 5 0 0 1 10 0v10M16 15v10" stroke="currentColor" stroke-width="2.5"/></svg>
          <span>bifrost</span>
        </a>
        <div class="header-detail">
          <span class="tagline">Your corner of the internet</span>
          <span class="header-count" id="total-count"></span>
          <button class="manage-button" id="manage-open" type="button" disabled>Manage</button>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <div class="heading-row">
          <h1>Your apps.</h1>
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <input id="search" type="search" aria-label="Find an app or domain" placeholder="Find an app or domain…" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
            <kbd aria-hidden="true">/</kbd>
          </label>
        </div>

        <div id="apps-section" aria-busy="true">
          <p class="visually-hidden" id="search-announcement" role="status"></p>
          <div id="launcher"></div>
          <div class="message" id="message" role="status">
            <p id="message-title">Loading apps…</p>
            <p class="message-detail" id="message-detail"></p>
            <button id="retry" type="button" hidden>Try again</button>
          </div>
        </div>
        <noscript><p class="noscript-message">Enable JavaScript to load the app list.</p><style>#message { display: none; }</style></noscript>
      </main>

      <footer class="site-footer"><span>Bifrost proxy</span><span>Your apps, one place.</span></footer>
    </div>
    <dialog class="manage" id="manage" aria-labelledby="manage-title"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
